<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | AI Tools</title>
  <link rel="stylesheet" href="logincss.css">
    
</head>
<body>
  <div class="wrapper">
    <div class="side-panel">
      <h1>Welcome to the AI Tools Assist</h1>
      <p>Experience the power of AI.<br /> Login to unlock your potential with AI.</p>
    </div>
    <div class="form-container">
      <h2>Login to your account</h2>
      <form action="#">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        
        <button type="submit-btn" onclick="location.href='index.html'">Login
          <a href="index.html">

          </a>
        </button>
      </form>

      <div class="create-account">
        <p>Don't have an account? 
          <a href="signup.html">Create one</a>
        </p>
      </div>

      <!-- 🌍 Updated Language Dropdown -->
      <div class="language-selector">
        <label for="language">🌐 Language:</label><br>
        <select id="language">
          <!-- Indian Languages -->
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="mr">Marathi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="kn">Kannada</option>
          <option value="ml">Malayalam</option>
          <option value="gu">Gujarati</option>
          <option value="pa">Punjabi</option>
          <option value="bn">Bengali</option>
          <option value="ur">Urdu</option>
          <option value="or">Odia</option>
          <option value="as">Assamese</option>

          <!-- International Languages -->
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh">Chinese (Mandarin)</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="ru">Russian</option>
          <option value="pt">Portuguese</option>
          <option value="ar">Arabic</option>
        </select>
      </div>
    </div>
  </div>
</body>
</html>
